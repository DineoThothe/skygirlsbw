<!-- HERO -->
<section class="bg-dark text-white text-center py-5">
  <div class="container">
    <h1 class="fw-bold">Get In Touch</h1>
    <p>We are here to listen, support and connect with you.</p>
  </div>
</section>

<!-- CONTACT SECTION -->
<section class="container py-5">

  <div class="row g-5">

    <!-- LEFT INFO -->
    <div class="col-md-5">

      <div class="card shadow p-4 h-100">

        <h4>Contact Information</h4>
        <hr>

        <p><i class="fa fa-envelope me-2"></i> info@skygirlsbw.org</p>
        <p><i class="fa fa-phone me-2"></i> +267 000 0000</p>
        <p><i class="fa fa-location-dot me-2"></i> Gaborone, Botswana</p>

        <hr>

        <h5>Follow Us</h5>

        <div class="d-flex gap-3 fs-4">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-youtube"></i></a>
        </div>

      </div>

    </div>

    <!-- RIGHT FORM -->
    <div class="col-md-7">

      <div class="card shadow p-4">

        <h4>Send Message</h4>
        <hr>

        <form>

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea rows="5" class="form-control"></textarea>
          </div>

          <button class="btn btn-dark w-100">Send Message</button>

        </form>

      </div>

    </div>

  </div>

</section>
