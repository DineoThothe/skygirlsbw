<!-- HERO -->
<section class="bg-dark text-white text-center py-5">
  <div class="container">
    <h1 class="fw-bold">We Value Your Voice</h1>
    <p>Your feedback helps SKYgirlsBW grow and improve.</p>
  </div>
</section>

<!-- FEEDBACK FORM -->
<section class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow p-4">

        <h3 class="text-center mb-3">Send Feedback</h3>

        <p class="text-center text-muted">
          Share your thoughts, ideas or suggestions with us.
        </p>

        <form>

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Your Feedback</label>
            <textarea rows="6" class="form-control" placeholder="Write your message here..."></textarea>
          </div>

          <button class="btn btn-dark w-100">Submit Feedback</button>

        </form>

      </div>

    </div>

  </div>

</section>
